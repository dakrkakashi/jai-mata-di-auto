<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="50%" stop-color="#111d2e" />
      <stop offset="100%" stop-color="#16263b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00d0d1" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#00d0d1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="12" fill="url(#bgGrad)" />
  <rect width="398" height="298" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Geometric Grid Pattern Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="300" />
    <line x1="120" y1="0" x2="120" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="280" y1="0" x2="280" y2="300" />
    <line x1="360" y1="0" x2="360" y2="300" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="200" cy="130" r="55" fill="url(#glowGrad)" filter="url(#softGlow)" />

  <!-- Outer Cog / Seal Ring -->
  <circle cx="200" cy="130" r="46" fill="#142236" stroke="url(#accentGrad)" stroke-width="2.5" />
  <circle cx="200" cy="130" r="38" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5" />

  <!-- Genuine Component / Wrench & Bolt Icon -->
  <g transform="translate(182, 112) scale(1.5)" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Hexagon / Nut -->
    <polygon points="12,4 18,7.5 18,16.5 12,20 6,16.5 6,7.5" fill="#1b2a40" stroke="#22c55e" stroke-width="1.5" />
    <!-- Bolt Center -->
    <circle cx="12" cy="12" r="3.2" fill="#22c55e" />
  </g>

  <!-- Genuine Part Badge Pill -->
  <rect x="135" y="196" width="130" height="24" rx="12" fill="rgba(34, 197, 94, 0.12)" stroke="#22c55e" stroke-width="1" />
  <text x="200" y="212" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#22c55e" letter-spacing="1.5" text-anchor="middle">
    GENUINE PART
  </text>

  <!-- Brand Label -->
  <text x="200" y="242" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    Ampere Authorized Store
  </text>
  <text x="200" y="260" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">
    Jai Mata Di Auto &bull; Loni
  </text>
</svg>
